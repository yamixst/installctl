name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dpkg-dev pkg-config libfuse3-dev

      - name: Build Debian package
        run: bash packaging/scripts/build-deb-local.sh

      - name: Verify package
        run: |
          dpkg-deb -I packaging/dist/*.deb
          dpkg-deb -c packaging/dist/*.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packaging/dist/*.deb

  build-rpm:
    name: Build RPM Package (AlmaLinux 9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build RPM package in Docker
        run: bash packaging/scripts/build-rpm-docker.sh

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: packaging/dist/*.rpm

  release:
    name: Publish GitHub Release
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.rpm
          generate_release_notes: true
