[package]
name = "installctl"
version = "0.1.0"
edition = "2024"

[dependencies]
fuser = "0.18"
nix = { version = "0.31", features = ["fs", "mount", "process", "sched", "signal", "socket", "uio", "user", "hostname", "poll", "term"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3"
base64 = "0.23"
anyhow = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
